services:
  fox-control:
    image: ghcr.io/fox-in-the-box-ai/fox-control:${FOX_VERSION:-latest}
    ports:
      - "9090:9090"
    volumes:
      - fox-data:/var/lib/fox-control
      - ./fox-control.toml:/etc/fox-control/fox-control.toml:ro
      - ./tls:/etc/fox-control/tls:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "https://localhost:9090/healthz", "--no-check-certificate"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes:
      - qdrant-data:/qdrant/storage
    # Qdrant ports are NOT exposed to the host — only fox-control reaches them
    # via the Docker network. Uncomment to expose for debugging:
    # ports:
    #   - "127.0.0.1:6333:6333"
    #   - "127.0.0.1:6334:6334"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fox-data:
  qdrant-data:
