# Air-gapped fox-control configuration.
#
# Designed for hosts with no internet access. All container images must be
# pre-pulled and loaded via `docker load` (see setup.sh). The embedding
# provider runs locally via Ollama — no external API calls.

# ---------- Control plane ----------

[control]
# Localhost only — no external network.
listen = "127.0.0.1:9090"

# Writable directory for instance data, event database, skillsets.
data_root = "/var/lib/fox-control"

# Poll instances every 30 seconds (relaxed for resource-constrained hosts).
health_poll_seconds = 30

# Plain-text logs are easier to read without a log aggregator.
log_format = "text"
log_level  = "info"

# Metrics disabled — no Prometheus in an air-gapped setup.
metrics_enabled = false

# ---------- Docker ----------

[docker]
# Use a pinned digest so fox-control never attempts to pull.
# Replace with the digest from `docker images --digests`.
image = "ghcr.io/fox-in-the-box-ai/fox@sha256:REPLACE_WITH_ACTUAL_DIGEST"

# ---------- Authentication ----------

[auth]
# Generated by setup.sh and written to /var/lib/fox-control/.secrets.
# Override via FOX_ADMIN_SECRET env var (minimum 16 characters).
admin_secret = "${FOX_ADMIN_SECRET}"

# Override via FOX_INSTANCE_PASSWORD env var.
instance_password = "${FOX_INSTANCE_PASSWORD}"

# ---------- Instances ----------

[instances]
port_start    = 8787
max_instances = 2

# ---------- Qdrant (vector database) ----------

[qdrant]
enabled   = true
image     = "qdrant/qdrant:v1.14.1"
http_port = 6333
grpc_port = 6334

# ---------- Data plane ----------

[data_plane]
enabled     = true
listen      = "127.0.0.1:9091"
collection  = "fox-knowledge"

# nomic-embed-text produces 768-dimensional vectors.
vector_size = 768

# ---------- Embedding provider (local Ollama) ----------

[embedding]
# Ollama running on the same host — no external network required.
base_url = "http://127.0.0.1:11434"
model    = "nomic-embed-text"
