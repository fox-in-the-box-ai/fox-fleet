{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fox-control.fullname" . }}
  labels:
    {{- include "fox-control.labels" . | nindent 4 }}
type: Opaque
data:
  admin-secret: {{ required "auth.adminSecret is required (set --set auth.adminSecret=...)" .Values.auth.adminSecret | b64enc | quote }}
  instance-password: {{ required "auth.instancePassword is required (set --set auth.instancePassword=...)" .Values.auth.instancePassword | b64enc | quote }}
{{- end }}
