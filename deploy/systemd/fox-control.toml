[control]
listen = "127.0.0.1:9090"
data_root = "/var/lib/fox-control"
health_poll_seconds = 15

[docker]
socket = "/var/run/docker.sock"
image = "ghcr.io/fox-in-the-box-ai/cloud:stable"

[auth]
# Must be set via FOX_ADMIN_SECRET and FOX_INSTANCE_PASSWORD env vars
# in /etc/fox-control/env. Empty defaults ensure startup fails without them.
admin_secret = ""
instance_password = ""

[instances]
port_start = 8787
max_instances = 10

# Uncomment and configure to enable the data plane (requires Qdrant).
# [qdrant]
# enabled = true
# http_port = 6333
# grpc_port = 6334
