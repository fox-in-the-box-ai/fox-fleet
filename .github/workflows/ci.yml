name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - name: Run tests with coverage
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /conformance/)
      - name: Check coverage threshold
        env:
          LC_NUMERIC: C
        run: |
          total=$(go tool cover -func=coverage.out | awk 'END {print $NF}' | tr -d '%')
          echo "Total coverage: ${total}%"
          threshold=45
          if awk "BEGIN {exit (${total} < ${threshold}) ? 0 : 1}"; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - run: go build ./cmd/fox-control

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -format json ./... > vuln.json 2>&1 || true
          # Filter out accepted-risk vulns with no upstream fix (see ADR-0016
          # + its 2026-08-12 amendment): Docker daemon-side paths the client
          # never calls, plus the deprecated x/crypto/openpgp advisory.
          EXCLUDED="GO-2026-4887 GO-2026-4883 GO-2026-5617 GO-2026-5668 GO-2026-5746 GO-2026-5932"
          UNEXCLUDED=$(jq -r '
            select(.finding != null)
            | .finding.osv
          ' vuln.json | sort -u | while read id; do
            echo "$EXCLUDED" | grep -qw "$id" || echo "$id"
          done)
          if [ -n "$UNEXCLUDED" ]; then
            echo "::error::Unaccepted vulnerabilities found: $UNEXCLUDED"
            govulncheck ./...
            exit 1
          fi
          echo "govulncheck clean (${#EXCLUDED} accepted-risk exclusions, see ADR-0016)"

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: |
          go build -ldflags "-X main.buildVersion=ci" \
            -o fox-control ./cmd/fox-control

      - name: Pull Fox instance image
        run: docker pull ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Run runtime conformance suite
        run: ./fox-control conformance run --image ghcr.io/fox-in-the-box-ai/cloud:stable

  conformance-plugin:
    name: Conformance (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: |
          go build -ldflags "-X main.buildVersion=ci" \
            -o fox-control ./cmd/fox-control

      - name: Pull Fox instance image
        run: docker pull ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Run plugin conformance suite
        run: ./fox-control conformance plugin --image ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Collect diagnostic info on failure
        if: failure()
        run: |
          echo "=== docker ps -a ==="
          docker ps -a --filter 'name=fox-' --no-trunc
          echo ""
          for cid in $(docker ps -aq --filter 'name=fox-'); do
            name=$(docker inspect --format '{{.Name}}' "$cid")
            echo "=== logs for $name ==="
            docker logs "$cid" --tail 200 2>&1 || true
            echo ""
            echo "=== inspect $name (State) ==="
            docker inspect --format '{{json .State}}' "$cid" 2>&1 || true
            echo ""
          done
          echo "=== /dev/net/tun ==="
          ls -la /dev/net/tun 2>&1 || echo "/dev/net/tun does not exist"
          echo ""
          echo "=== sysctl net.ipv4.ip_forward ==="
          sysctl net.ipv4.ip_forward 2>&1 || true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: e2e
        run: bash setup.sh

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-traces
          path: e2e/test-results/
          retention-days: 7
