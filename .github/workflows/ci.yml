name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go test ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go build ./cmd/fox-control

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: go build -o fox-control ./cmd/fox-control

      - name: Build conformance image
        run: |
          docker build -t fox-control:ci \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            .

      - name: Run runtime conformance suite
        run: ./fox-control conformance run --image fox-control:ci

      - name: Run plugin conformance suite
        run: ./fox-control conformance plugin --image fox-control:ci
