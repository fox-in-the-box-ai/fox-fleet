name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: latest
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - name: Run tests with coverage
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out $(go list ./... | grep -v /conformance/)
      - name: Check coverage threshold
        env:
          LC_NUMERIC: C
        run: |
          total=$(go tool cover -func=coverage.out | awk 'END {print $NF}' | tr -d '%')
          echo "Total coverage: ${total}%"
          threshold=45
          if awk "BEGIN {exit (${total} < ${threshold}) ? 0 : 1}"; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - run: go build ./cmd/fox-control

  govulncheck:
    name: Govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: |
          govulncheck -format json ./... > vuln.json 2>&1 || true
          # Filter out Docker daemon-side vulns with no upstream fix (see ADR-0016)
          EXCLUDED="GO-2026-4887 GO-2026-4883"
          UNEXCLUDED=$(jq -r '
            select(.finding != null)
            | .finding.osv
          ' vuln.json | sort -u | while read id; do
            echo "$EXCLUDED" | grep -qw "$id" || echo "$id"
          done)
          if [ -n "$UNEXCLUDED" ]; then
            echo "::error::Unaccepted vulnerabilities found: $UNEXCLUDED"
            govulncheck ./...
            exit 1
          fi
          echo "govulncheck clean (${#EXCLUDED} accepted-risk exclusions, see ADR-0016)"

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: |
          go build -ldflags "-X main.buildVersion=ci" \
            -o fox-control ./cmd/fox-control

      - name: Pull Fox instance image
        run: docker pull ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Run runtime conformance suite
        run: ./fox-control conformance run --image ghcr.io/fox-in-the-box-ai/cloud:stable

  conformance-plugin:
    name: Conformance (plugin)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: |
          go build -ldflags "-X main.buildVersion=ci" \
            -o fox-control ./cmd/fox-control

      - name: Pull Fox instance image
        run: docker pull ghcr.io/fox-in-the-box-ai/cloud:stable

      - name: Run plugin conformance suite
        run: ./fox-control conformance plugin --image ghcr.io/fox-in-the-box-ai/cloud:stable
