name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Run tests with coverage
        run: go test -race -shuffle=on -count=1 -coverprofile=coverage.out ./...
      - name: Check coverage threshold
        env:
          LC_NUMERIC: C
        run: |
          total=$(go tool cover -func=coverage.out | awk 'END {print $NF}' | tr -d '%')
          echo "Total coverage: ${total}%"
          threshold=45
          if awk "BEGIN {exit (${total} < ${threshold}) ? 0 : 1}"; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go build ./cmd/fox-control

  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build fox-control binary
        run: |
          go build -ldflags "-X main.buildVersion=ci" \
            -o fox-control ./cmd/fox-control

      - name: Build conformance image
        run: |
          docker build -t fox-control:ci \
            --build-arg VERSION=ci \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            .

      - name: Run runtime conformance suite
        run: ./fox-control conformance run --image fox-control:ci

      - name: Run plugin conformance suite
        run: ./fox-control conformance plugin --image fox-control:ci
