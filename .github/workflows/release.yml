name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY=fox-control
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=fox-control.exe
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${{ github.ref_name }} -X main.buildCommit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/fox-control
        shell: bash

      - name: Package artifact
        run: |
          ARTIFACT=fox-control-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir "${ARTIFACT}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp fox-control.exe "${ARTIFACT}/"
          else
            cp fox-control "${ARTIFACT}/"
          fi
          cp LICENSE "${ARTIFACT}/"
          cp README.md "${ARTIFACT}/"
          tar czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: fox-control-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@95a15b6ca863c73e13e8cf14dd3e41099e032397
        with:
          syft-version: v1.20.0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG}. See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Generate SBOM
        run: |
          TAG="${{ github.ref_name }}"
          syft dir:. --select-catalogers go-module-file-cataloger \
            --output "cyclonedx-json=artifacts/fox-control-${TAG}.sbom.cdx.json"

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.sbom.cdx.json > checksums-sha256.txt

      - name: Sign release artifacts
        run: |
          cd artifacts
          for f in *.tar.gz *.sbom.cdx.json; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done
          cosign sign-blob --yes \
            --output-signature checksums-sha256.txt.sig \
            --output-certificate checksums-sha256.txt.pem \
            checksums-sha256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          if echo "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Fox Fleet ${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE} \
            artifacts/*.tar.gz \
            artifacts/*.sig \
            artifacts/*.pem \
            artifacts/*.sbom.cdx.json \
            artifacts/checksums-sha256.txt

  container:
    name: Container Image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/fox-control
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        id: push
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sign-image:
    name: Sign Container Image
    needs: container
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@95a15b6ca863c73e13e8cf14dd3e41099e032397
        with:
          syft-version: v1.20.0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign container image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/fox-control@${{ needs.container.outputs.digest }}

      - name: Generate and attest container SBOM
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/fox-control@${{ needs.container.outputs.digest }}"
          syft "${IMAGE}" --output cyclonedx-json=/tmp/container-sbom.cdx.json
          cosign attest --yes --predicate /tmp/container-sbom.cdx.json --type cyclonedx "${IMAGE}"
