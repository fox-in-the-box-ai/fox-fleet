name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          BINARY=fox-control
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY=fox-control.exe
          fi
          go build -trimpath \
            -ldflags "-s -w -X main.buildVersion=${{ github.ref_name }} -X main.buildCommit=${{ github.sha }} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "${BINARY}" \
            ./cmd/fox-control
        shell: bash

      - name: Package artifact
        run: |
          ARTIFACT=fox-control-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir "${ARTIFACT}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp fox-control.exe "${ARTIFACT}/"
          else
            cp fox-control "${ARTIFACT}/"
          fi
          cp LICENSE "${ARTIFACT}/"
          cp README.md "${ARTIFACT}/"
          tar czf "${ARTIFACT}.tar.gz" "${ARTIFACT}"
        shell: bash

      - uses: actions/upload-artifact@v7
        with:
          name: fox-control-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${TAG}. See CHANGELOG.md for details." > release-notes.md
          fi

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums-sha256.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          PRERELEASE=""
          if echo "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then
            PRERELEASE="--prerelease"
          fi
          gh release create "$TAG" \
            --title "Fox Fleet ${TAG}" \
            --notes-file release-notes.md \
            ${PRERELEASE} \
            artifacts/*.tar.gz \
            artifacts/checksums-sha256.txt
