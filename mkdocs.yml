site_name: Fox Fleet
site_description: Open-source management plane for Fox AI assistant fleets
site_url: https://fox-in-the-box-ai.github.io/fox-fleet
repo_url: https://github.com/fox-in-the-box-ai/fox-fleet
repo_name: fox-in-the-box-ai/fox-fleet
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started.md
      - Walkthrough: WALKTHROUGH.md
  - Deployment:
      - Deployment Guide: DEPLOYMENT.md
      - Limitations: LIMITATIONS.md
  - Security:
      - Release Signing: security/signing.md
  - Reference:
      - Configuration: configuration.md
      - Changelog: changelog.md
  - Contributing: contributing.md
