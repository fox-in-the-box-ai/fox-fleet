<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
:root {
  --color-bg: var(--sand-50);
  --color-surface: var(--sand-100);
  --color-surface-strong: var(--sand-800);
  --color-text: var(--sand-800);
  --color-text-muted: var(--sand-600);
  --color-border: var(--sand-300);
  --color-border-subtle: rgba(26, 22, 16, 0.08);
  --color-accent: var(--fox-600);
  --color-wash: rgba(26, 22, 16, 0.025);
  --color-wash-hover: rgba(234, 88, 12, 0.08);
  --color-primary-fill: var(--fox-600);
  --color-primary-hover: var(--fox-700);
  --color-on-primary: var(--sand-0);
  --color-shadow: rgba(184, 160, 137, 0.40);
  --color-success: var(--ds-success);
  --color-error: var(--ds-error);
  --color-warning: var(--ds-warning);
  --color-info: var(--cyan-deep);

  --sidebar-bg: var(--sand-800);
  --sidebar-text: var(--sand-50);
  --sidebar-muted: rgba(254, 252, 247, 0.55);
  --sidebar-hover: rgba(255, 255, 255, 0.08);
  --sidebar-active: rgba(234, 88, 12, 0.18);
  --sidebar-border: rgba(255, 255, 255, 0.08);

  --font-heading: var(--font-sans);
  --font-body: var(--font-sans);

  --radius-sm: var(--ds-radius-xs);
  --radius-md: var(--ds-radius-md);
  --radius-lg: var(--ds-radius-lg);
  --shadow-card: var(--ds-shadow-brand);
  --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.18);
  --sidebar-width: 240px;
  --transition: var(--dur-fast) ease;

  --toast-error-bg: #fef2f2;
  --toast-error-border: rgba(198, 40, 40, 0.20);
  --toast-success-bg: #f0fdf4;
  --toast-success-border: rgba(61, 139, 64, 0.20);
  --toast-shadow: var(--ds-shadow-md);
  --overlay-bg: rgba(26, 22, 16, 0.40);
  --badge-error-bg: rgba(198, 40, 40, 0.08);
  --badge-success-bg: rgba(61, 139, 64, 0.10);
  --badge-warning-bg: rgba(230, 138, 0, 0.10);
  --code-bg: var(--sand-800);
  --code-text: var(--sand-50);
}

[data-theme="dark"] {
  --color-bg: var(--night-900);
  --color-surface: var(--night-800);
  --color-surface-strong: var(--sand-50);
  --color-text: var(--cream);
  --color-text-muted: #C0B6A2;
  --color-border: var(--night-600);
  --color-border-subtle: rgba(255, 255, 255, 0.075);
  --color-accent: var(--fox-500);
  --color-wash: rgba(255, 255, 255, 0.025);
  --color-wash-hover: rgba(249, 115, 22, 0.12);
  --color-primary-fill: var(--fox-500);
  --color-primary-hover: var(--fox-400);
  --color-on-primary: var(--sand-0);
  --color-shadow: rgba(0, 0, 0, 0.50);
  --color-success: var(--ds-success-bright);
  --color-error: var(--ds-error-bright);
  --color-warning: var(--ds-warning-bright);
  --color-info: var(--ds-info-bright);

  --sidebar-bg: var(--night-950);
  --sidebar-text: var(--cream);
  --sidebar-muted: rgba(255, 248, 220, 0.50);
  --sidebar-hover: rgba(255, 255, 255, 0.06);
  --sidebar-active: rgba(249, 115, 22, 0.18);
  --sidebar-border: rgba(255, 255, 255, 0.06);

  --shadow-card: var(--ds-shadow-brand);
  --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.40);

  --toast-error-bg: rgba(239, 83, 80, 0.10);
  --toast-error-border: rgba(239, 83, 80, 0.20);
  --toast-success-bg: rgba(76, 175, 80, 0.10);
  --toast-success-border: rgba(76, 175, 80, 0.20);
  --toast-shadow: var(--ds-shadow-md);
  --overlay-bg: rgba(0, 0, 0, 0.60);
  --badge-error-bg: rgba(239, 83, 80, 0.10);
  --badge-success-bg: rgba(76, 175, 80, 0.10);
  --badge-warning-bg: rgba(255, 167, 38, 0.10);
  --code-bg: var(--night-950);
  --code-text: #C0B6A2;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--color-text);
  background: var(--color-bg);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Auth Screen ───────────────────────────────────────────────────── */
#auth-screen {
  position: fixed; inset: 0; z-index: 100;
  background: var(--color-bg);
  display: flex; align-items: center; justify-content: center;
}
.auth-card {
  width: 100%; max-width: 380px; padding: 0 24px;
  text-align: center;
}
.auth-brand {
  font-family: var(--font-heading);
  font-size: 1.5rem; font-weight: 300;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
  color: var(--color-text);
}
.auth-tagline {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 32px;
}
.auth-label {
  display: block; text-align: left;
  font-size: 12px; font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 8px;
}
.auth-input {
  width: 100%; padding: 10px 14px;
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  font: inherit; font-size: 14px;
  color: var(--color-text);
  outline: none;
  transition: border-color var(--transition);
}
.auth-input:focus { border-color: var(--color-accent); }
.auth-btn {
  width: 100%; margin-top: 16px; padding: 11px 20px;
  background: var(--color-primary-fill);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  font: inherit; font-size: 14px; font-weight: 600;
  color: var(--color-on-primary);
  cursor: pointer;
  transition: background var(--transition);
}
.auth-btn:hover { background: var(--color-primary-hover); }
.auth-error {
  margin-top: 12px; padding: 8px 12px;
  background: var(--badge-error-bg);
  border: 1px solid var(--toast-error-border);
  border-radius: var(--radius-sm);
  font-size: 13px;
  color: var(--color-error);
  display: none;
}

/* ── Shell Layout ──────────────────────────────────────────────────── */
#shell { display: none; min-height: 100vh; }
#sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-width);
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  display: flex; flex-direction: column;
  z-index: 50;
  overflow-y: auto;
}
#main {
  margin-left: var(--sidebar-width);
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ── Sidebar ───────────────────────────────────────────────────────── */
.sb-brand {
  padding: 20px 20px 8px;
  font-family: var(--font-heading);
  font-size: 1.1rem; font-weight: 300;
  letter-spacing: -0.01em;
}
.sb-tagline {
  padding: 0 20px 20px;
  font-size: 11px;
  color: var(--sidebar-muted);
  line-height: 1.4;
  border-bottom: 1px solid var(--sidebar-border);
}
.sb-section {
  padding: 12px 12px 4px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--sidebar-muted);
}
.sb-nav { list-style: none; padding: 4px 8px; }
.sb-nav li { margin-bottom: 2px; }
.sb-link {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500;
  color: var(--sidebar-text);
  text-decoration: none;
  cursor: pointer;
  transition: background var(--transition);
  border: none; background: none; width: 100%;
  font-family: inherit;
}
.sb-link:hover { background: var(--sidebar-hover); }
.sb-link.active { background: var(--sidebar-active); font-weight: 600; }
.sb-link svg {
  width: 18px; height: 18px; flex-shrink: 0;
  stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.sb-link .soon {
  margin-left: auto;
  font-size: 9px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--sidebar-muted);
  background: var(--sidebar-hover);
  padding: 2px 6px;
  border-radius: var(--radius-sm);
}
.sb-footer {
  margin-top: auto;
  padding: 16px 20px;
  border-top: 1px solid var(--sidebar-border);
  font-size: 11px;
  color: var(--sidebar-muted);
}
.sb-footer-row { display: flex; gap: 8px; margin-bottom: 8px; }
#lang-select, #theme-select {
  background: transparent;
  color: var(--sidebar-muted);
  border: 1px solid var(--sidebar-border);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 12px;
  font-family: var(--font-body);
  cursor: pointer;
}
#lang-select option, #theme-select option {
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
}

/* ── Page Header ───────────────────────────────────────────────────── */
.page-header {
  padding: 24px 32px 0;
  display: flex; align-items: center; justify-content: space-between;
}
.page-title {
  font-family: var(--font-heading);
  font-size: 1.25rem; font-weight: 400;
  letter-spacing: -0.02em;
}
.page-meta {
  font-size: 12px;
  color: var(--color-text-muted);
}

/* ── Content Area ──────────────────────────────────────────────────── */
#content { padding: 20px 32px 32px; flex: 1; }

/* ── Toolbar ───────────────────────────────────────────────────────── */
.toolbar {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap;
}
.input {
  padding: 8px 12px;
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-md);
  font: inherit; font-size: 13px;
  color: var(--color-text);
  outline: none;
  transition: border-color var(--transition);
}
.input:focus { border-color: var(--color-accent); }
.input::placeholder { color: var(--color-text-muted); }

/* ── Buttons ───────────────────────────────────────────────────────── */
.btn {
  padding: 8px 16px;
  border-radius: var(--radius-md);
  font: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--transition), border-color var(--transition);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary {
  background: var(--color-primary-fill);
  border-color: transparent;
  color: var(--color-on-primary);
}
.btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); }
.btn-danger {
  background: var(--badge-error-bg);
  border-color: var(--toast-error-border);
  color: var(--color-error);
}
.btn-danger:hover:not(:disabled) {
  background: var(--color-error);
  color: var(--color-bg);
  border-color: var(--color-error);
}
.btn-ghost {
  background: none;
  color: var(--color-text-muted);
}
.btn-ghost:hover:not(:disabled) { background: var(--color-wash-hover); }

/* ── Cards ─────────────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  cursor: pointer;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.card:hover {
  border-color: var(--color-border);
  box-shadow: var(--shadow-card);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.card-id {
  font-family: var(--font-heading);
  font-weight: 500; font-size: 15px;
  letter-spacing: -0.01em;
}
.card-meta {
  display: flex; flex-direction: column; gap: 4px;
  font-size: 12px; color: var(--color-text-muted);
}

/* ── Health Dots ───────────────────────────────────────────────────── */
.dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.dot.healthy { background: var(--color-success); }
.dot.unhealthy {
  background: var(--color-error);
  animation: pulse-dot 2s ease-in-out infinite;
}
.dot.unknown { background: var(--color-border); }
@keyframes pulse-dot {
  0%, 100% { box-shadow: 0 0 0 0 rgba(198, 40, 40, 0.40); }
  50% { box-shadow: 0 0 0 5px rgba(198, 40, 40, 0); }
}

/* ── Detail View ───────────────────────────────────────────────────── */
.detail-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 24px;
}
.detail-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--color-border-subtle);
}
.detail-title {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-heading);
  font-size: 1.1rem; font-weight: 500;
}
.detail-grid {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 8px 16px;
  font-size: 13px;
  margin-bottom: 20px;
}
.detail-grid dt {
  color: var(--color-text-muted);
  font-weight: 500;
}
.detail-grid dd { color: var(--color-text); }
.logs-section h3 {
  font-family: var(--font-heading);
  font-size: 14px; font-weight: 500;
  margin-bottom: 8px;
}
.logs {
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: var(--radius-md);
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  max-height: 360px;
  overflow-y: auto;
}
.back-link {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 500;
  color: var(--color-text-muted);
  cursor: pointer; border: none; background: none;
  font-family: inherit;
  margin-bottom: 16px;
  transition: color var(--transition);
}
.back-link:hover { color: var(--color-text); }

/* ── Table ─────────────────────────────────────────────────────────── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  text-align: left;
  padding: 10px 14px;
  font-size: 11px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--color-text-muted);
  border-bottom: 1px solid var(--color-border-subtle);
}
.data-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--color-wash);
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr {
  transition: background var(--transition);
}
.data-table tbody tr:hover { background: var(--color-wash-hover); }

/* ── Badges ────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}
.badge-active, .badge-running {
  background: var(--badge-success-bg);
  color: var(--color-success);
}
.badge-ingesting, .badge-provisioning {
  background: var(--badge-warning-bg);
  color: var(--color-warning);
}
.badge-error {
  background: var(--badge-error-bg);
  color: var(--color-error);
}
.badge-pending, .badge-unknown {
  background: var(--color-wash-hover);
  color: var(--color-text-muted);
}

/* ── Empty States ──────────────────────────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 64px 24px;
}
.empty-icon {
  width: 56px; height: 56px;
  margin: 0 auto 16px;
  stroke: var(--color-border);
  fill: none;
  stroke-width: 1.2;
}
.empty-title {
  font-family: var(--font-heading);
  font-size: 16px; font-weight: 500;
  margin-bottom: 8px;
}
.empty-desc {
  font-size: 13px;
  color: var(--color-text-muted);
  max-width: 360px;
  margin: 0 auto 20px;
}

/* ── Skeleton Loading ──────────────────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, var(--color-wash) 25%, var(--color-wash-hover) 50%, var(--color-wash) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
.skel-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
}
.skel-line { height: 14px; margin-bottom: 8px; border-radius: var(--radius-sm); }
.skel-line-short { width: 60%; }
.skel-line-med { width: 80%; }
.skel-dot { width: 10px; height: 10px; border-radius: 50%; }

/* ── Toast Notifications ───────────────────────────────────────────── */
#toast-container {
  position: fixed; top: 20px; right: 20px;
  z-index: 200;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 13px; font-weight: 500;
  box-shadow: var(--toast-shadow);
  display: flex; align-items: center; gap: 10px;
  pointer-events: auto;
  animation: toast-in 0.25s ease;
  max-width: 380px;
}
.toast-error {
  background: var(--toast-error-bg);
  border: 1px solid var(--toast-error-border);
  color: var(--color-error);
}
.toast-success {
  background: var(--toast-success-bg);
  border: 1px solid var(--toast-success-border);
  color: var(--color-success);
}
.toast-dismiss {
  margin-left: auto;
  background: none; border: none;
  font-size: 16px; cursor: pointer;
  color: inherit; opacity: 0.5;
  padding: 0 4px;
}
.toast-dismiss:hover { opacity: 1; }
@keyframes toast-in {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Modal ─────────────────────────────────────────────────────────── */
#modal-overlay {
  position: fixed; inset: 0; z-index: 150;
  background: var(--overlay-bg);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.modal {
  background: var(--color-bg);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  width: 100%; max-width: 420px;
  padding: 24px;
}
.modal-title {
  font-family: var(--font-heading);
  font-size: 16px; font-weight: 500;
  margin-bottom: 8px;
}
.modal-desc {
  font-size: 13px;
  color: var(--color-text-muted);
  margin-bottom: 20px;
}
.modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 20px;
}
.modal-field { margin-bottom: 12px; }
.modal-label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--color-text-muted);
  margin-bottom: 6px;
}

/* ── Drop Zone ────────────────────────────────────────────────────── */
.drop-zone {
  border: 2px dashed var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  text-align: center;
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition);
  margin-bottom: 20px;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--color-accent);
  background: var(--color-wash);
}
.drop-zone-text {
  font-size: 13px;
  color: var(--color-text-muted);
}
.drop-zone-text strong {
  color: var(--color-text);
}
.manifest-pre {
  background: var(--code-bg);
  color: var(--code-text);
  border-radius: var(--radius-md);
  padding: 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  max-height: 400px;
  overflow-y: auto;
}

/* ── Query Results ─────────────────────────────────────────────────── */
.query-input-row {
  display: flex; gap: 10px; margin-bottom: 20px;
}
.query-input-row .input { flex: 1; }
.result-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border-subtle);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}
.result-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.result-score {
  font-family: var(--font-mono);
  font-size: 12px; font-weight: 600;
  color: var(--color-success);
}
.result-meta {
  font-size: 11px; color: var(--color-text-muted);
  display: flex; gap: 12px; flex-wrap: wrap;
}
.result-text {
  font-size: 13px; line-height: 1.6;
  margin-top: 8px;
  white-space: pre-wrap;
}
.query-opts {
  display: flex; gap: 10px; align-items: center;
  margin-bottom: 12px; font-size: 13px;
}
.query-opts label {
  color: var(--color-text-muted);
  font-size: 12px; font-weight: 500;
}
.query-opts .input { width: 80px; }

/* ── Placeholder Pages ─────────────────────────────────────────────── */
.placeholder-page {
  text-align: center;
  padding: 80px 24px;

<script>
var state = {
  secret: sessionStorage.getItem("fox_secret") || "",
  page: "instances",
  detailId: "",
  skillsetDetail: "",
  sourceDetail: "",
  loading: false,
  refreshTimer: null,
  eventSource: null,
  sseToken: "",
  sseRefreshTimer: null,
  locale: localStorage.getItem("fox_locale") || "en",
  theme: localStorage.getItem("fox_theme") || "system"
};

/* ── i18n ─────────────────────────────────────────────────────────── */

var langs = {};

function loadLocale(loc) {
  if (langs[loc]) return Promise.resolve();
  return fetch("i18n/" + loc + ".json").then(function(res) {
    if (!res.ok) throw new Error("i18n: " + loc);
    return res.json();
  }).then(function(data) { langs[loc] = data; });
}

function loadAllLocales() {
  return Promise.all(["en", state.locale].map(loadLocale));
}

function t(key, params) {
  var dict = langs[state.locale] || langs.en;
  var s = dict[key] || langs.en[key] || key;
  if (params) { Object.keys(params).forEach(function(k) { s = s.split("{" + k + "}").join(params[k]); }); }
  return s;
}

function tPlural(key, n) {
  var k = n === 1 ? key : key + "_plural";
  return t(k, { n: n });
}

function setLocale(loc) {
  state.locale = loc;
  localStorage.setItem("fox_locale", loc);
  loadLocale(loc).then(function() {
    applyStaticText();
    var p = state.page;
    navigate(p);
  }).catch(function() {
    applyStaticText();
    navigate(state.page);
  });
}

function applyStaticText() {
  document.documentElement.lang = state.locale;
  document.querySelectorAll("[data-i18n]").forEach(function(el) { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(function(el) { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.querySelectorAll("[data-i18n-aria]").forEach(function(el) { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
  var sel = document.getElementById("lang-select");
  if (sel) sel.value = state.locale;
}

/* ── Theme ─────────────────────────────────────────────────────────── */

function applyTheme() {
  var pref = state.theme;
  var dark = pref === "dark" || (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  var sel = document.getElementById("theme-select");
  if (sel) sel.value = pref;
}

function setTheme(val) {
  state.theme = val;
  localStorage.setItem("fox_theme", val);
  applyTheme();
}

window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function() {
  if (state.theme === "system") applyTheme();
});

/* ── Auth ──────────────────────────────────────────────────────────── */

function initAuth() {
  applyTheme();
  applyStaticText();
  if (state.secret) { enterApp(); return; }
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("shell").style.display = "none";
  var input = document.getElementById("secret-input");
  input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doAuth();
  });
  document.getElementById("auth-btn").addEventListener("click", doAuth);
}

function doAuth() {
  var val = document.getElementById("secret-input").value.trim();
  if (!val) return;
  state.secret = val;
  sessionStorage.setItem("fox_secret", val);
  document.getElementById("auth-error").style.display = "none";
  enterApp();
}

function enterApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("shell").style.display = "flex";
  refresh();
  fetchSSEToken().then(function() { connectSSE(); }).catch(function() { startAutoRefresh(); });
}

function logout() {
  sessionStorage.removeItem("fox_secret");
  state.secret = "";
  state.sseToken = "";
  if (state.sseRefreshTimer) { clearTimeout(state.sseRefreshTimer); state.sseRefreshTimer = null; }
  stopAutoRefresh();
  if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("shell").style.display = "none";
  document.getElementById("secret-input").value = "";
}

/* ── API ───────────────────────────────────────────────────────────── */

function apiFetch(path, opts) {
  opts = opts || {};
  var headers = Object.assign({ "Authorization": "Bearer " + state.secret }, opts.headers || {});
  return fetch(path, Object.assign({}, opts, { headers: headers })).then(function(res) {
    if (res.status === 401) {
      logout();
      throw new Error("Unauthorized");
    }
    return res;
  });
}

/* ── SSE / Auto-Refresh ───────────────────────────────────────────── */

var _refreshPending = null;

function fetchSSEToken() {
  return apiFetch("/api/auth/session", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ purpose: "sse" })
  }).then(function(res) {
    if (!res.ok) throw new Error("session token request failed");
    return res.json();
  }).then(function(data) {
    state.sseToken = data.token;
    var expiresAt = new Date(data.expires_at).getTime();
    var refreshIn = Math.max((expiresAt - Date.now()) - 120000, 10000);
    if (state.sseRefreshTimer) clearTimeout(state.sseRefreshTimer);
    state.sseRefreshTimer = setTimeout(refreshSSEToken, refreshIn);
  });
}

function refreshSSEToken() {
  fetchSSEToken().catch(function() { logout(); });
}

function connectSSE() {
  stopAutoRefresh();
  if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
  if (!state.sseToken) return;

  var es = new EventSource("/api/events/stream");
  state.eventSource = es;

  es.onopen = function() { stopAutoRefresh(); };

  es.onmessage = function() {
    if (_refreshPending) clearTimeout(_refreshPending);
    _refreshPending = setTimeout(function() { _refreshPending = null; refresh(); }, 100);
  };

  es.onerror = function() {
    if (es.readyState === 2) {
      fetchSSEToken().then(function() { connectSSE(); }).catch(function() {
        if (!state.refreshTimer) startAutoRefresh();
      });
    }
  };
}

function startAutoRefresh() {
  stopAutoRefresh();
  state.refreshTimer = setInterval(refresh, 5000);
}

function stopAutoRefresh() {
  if (state.refreshTimer) { clearInterval(state.refreshTimer); state.refreshTimer = null; }
}

function refresh() {
  if (!state.secret) return;
  var p = state.page;
  if (p === "instances" && state.detailId) { renderDetail(state.detailId); }
  else if (p === "instances") { renderInstances(); }
  else if (p === "sources" && state.sourceDetail) { renderSourceDetail(state.sourceDetail); }
  else if (p === "sources") { renderSources(); }
  else if (p === "skillsets" && state.skillsetDetail) { renderSkillsetDetail(state.skillsetDetail); }
  else if (p === "skillsets") { renderSkillsets(); }
  else if (p === "query") { return; }
  else if (p === "activity") { renderActivity(); }
  else { renderPlaceholder(p); }
  document.getElementById("last-updated").textContent = t("updated") + " " + new Date().toLocaleTimeString(state.locale);
}

/* ── Navigation ────────────────────────────────────────────────────── */

function navigate(page) {
  closeSidebar();
  state.page = page;
  state.detailId = "";
  state.skillsetDetail = "";
  state.sourceDetail = "";
  document.querySelectorAll(".sb-link").forEach(function(el) {
    el.classList.toggle("active", el.dataset.page === page);
  });
  document.getElementById("page-title").textContent = t("nav." + page) || page;
  if (page === "query") { renderQuery(); return; }
  refresh();
}

document.getElementById("sidebar").addEventListener("click", function(e) {
  var link = e.target.closest(".sb-link");
  if (link && link.dataset.page) navigate(link.dataset.page);
});

document.getElementById("lang-select").addEventListener("change", function() {
  setLocale(this.value);
});

document.getElementById("theme-select").addEventListener("change", function() {
  setTheme(this.value);
});

/* ── Mobile Sidebar ───────────────────────────────────────────────── */

function closeSidebar() {
  document.body.classList.remove("sidebar-open");
  document.getElementById("hamburger").setAttribute("aria-expanded", "false");
}

function openSidebar() {
  document.body.classList.add("sidebar-open");
  document.getElementById("hamburger").setAttribute("aria-expanded", "true");
  var first = document.querySelector("#sidebar .sb-link");
  if (first) first.focus();
}

document.getElementById("hamburger").addEventListener("click", function() {
  if (document.body.classList.contains("sidebar-open")) closeSidebar();
  else openSidebar();
});

document.getElementById("sidebar-overlay").addEventListener("click", function() {
  closeSidebar();
  document.getElementById("hamburger").focus();
});

document.addEventListener("keydown", function(e) {
  if (e.key === "Escape" && document.body.classList.contains("sidebar-open")) {
    closeSidebar();
    document.getElementById("hamburger").focus();
  }
});

matchMedia("(max-width: 768px)").addEventListener("change", function(e) {
  if (!e.matches) closeSidebar();
});

/* ── Toast ─────────────────────────────────────────────────────────── */

function showToast(msg, type) {
  type = type || "error";
  var el = document.createElement("div");
  el.className = "toast toast-" + type;
  el.innerHTML = esc(msg) + '<button class="toast-dismiss">&times;</button>';
  document.getElementById("toast-container").appendChild(el);
  el.querySelector(".toast-dismiss").addEventListener("click", function() { el.remove(); });
  setTimeout(function() { if (el.parentNode) el.remove(); }, 6000);
}

/* ── Modal ─────────────────────────────────────────────────────────── */

function showModal(html) {
  var overlay = document.getElementById("modal-overlay");
  overlay.innerHTML = html;
  overlay.style.display = "flex";
}

function closeModal() {
  document.getElementById("modal-overlay").style.display = "none";
  document.getElementById("modal-overlay").innerHTML = "";
}

document.getElementById("modal-overlay").addEventListener("click", function(e) {
  if (e.target === this) closeModal();
});

/* ── Skeleton Helpers ──────────────────────────────────────────────── */

function skeletonCards(n) {
  var html = '<div class="grid">';
  for (var i = 0; i < n; i++) {
    html += '<div class="skel-card">'
      + '<div style="display:flex;justify-content:space-between;margin-bottom:12px">'
      + '<div class="skeleton skel-line" style="width:120px"></div>'
      + '<div class="skeleton skel-dot"></div></div>'
      + '<div class="skeleton skel-line skel-line-short"></div>'
      + '<div class="skeleton skel-line skel-line-med"></div>'
      + '</div>';
  }
  return html + '</div>';
}

/* ── Instances View ────────────────────────────────────────────────── */

function renderInstances() {
  var content = document.getElementById("content");
  if (state.loading) { content.innerHTML = skeletonCards(4); return; }

  apiFetch("/api/instances").then(function(res) { return res.json(); }).then(function(instances) {
    document.getElementById("page-meta").textContent = tPlural("meta.instances", instances.length);

    var html = '<div class="toolbar">'
      + '<button class="btn btn-primary" id="btn-provision">' + esc(t("inst.provision")) + '</button>'
      + '</div>';

    if (instances.length === 0) {
      html += '<div class="empty-state">'
        + '<svg class="empty-icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="18" rx="2"/><line x1="2" y1="9" x2="22" y2="9"/><circle cx="7" cy="6" r="1"/><circle cx="11" cy="6" r="1"/></svg>'
        + '<div class="empty-title">' + esc(t("inst.empty_title")) + '</div>'
        + '<div class="empty-desc">' + esc(t("inst.empty_desc")) + '</div>'
        + '<button class="btn btn-primary" id="btn-provision-empty">' + esc(t("inst.create")) + '</button>'
        + '</div>';
    } else {
      html += '<div class="grid">';
      for (var i = 0; i < instances.length; i++) {
        var inst = instances[i];
        var h = inst.health;
        var dot = h ? (h.healthy ? "healthy" : "unhealthy") : "unknown";
        var statusBadge = inst.status || "unknown";
        html += '<div class="card" data-action="detail" data-id="' + esc(inst.id) + '" tabindex="0" role="button">'
          + '<div class="card-header">'
          + '<span class="card-id">' + esc(inst.id) + '</span>'
          + '<span class="dot ' + dot + '"></span></div>'
          + '<div class="card-meta">'
          + '<span><span class="badge badge-' + esc(statusBadge) + '">' + esc(statusBadge) + '</span></span>'
          + '<span>' + esc(t("inst.port")) + ' ' + esc(String(inst.port)) + '</span>'
          + '<span>' + formatDate(inst.created_at) + '</span>'
          + '</div></div>';
      }
      html += '</div>';
    }
    content.innerHTML = html;
  }).catch(function(e) {
    if (e.message !== "Unauthorized") showToast(t("err.instances", { msg: e.message }));
  });
}

/* ── Provision Modal ───────────────────────────────────────────────── */

function showProvisionModal() {
  showModal(
    '<div class="modal">'
    + '<div class="modal-title">' + esc(t("prov.title")) + '</div>'
    + '<div class="modal-desc">' + esc(t("prov.desc")) + '</div>'
    + '<div class="modal-field">'
    + '<label class="modal-label" for="m-id">' + esc(t("prov.id_label")) + '</label>'

function formatBytes(bytes) {
  if (bytes === 0) return "0 B";
  var units = ["B", "KB", "MB", "GB"];
  var i = Math.floor(Math.log(bytes) / Math.log(1024));
  if (i >= units.length) i = units.length - 1;
  return (bytes / Math.pow(1024, i)).toFixed(1) + " " + units[i];
}

function loadInstanceStats(id) {

function loadHealthHistory(id) {
  apiFetch("/api/instances/" + encodeURIComponent(id) + "/health-history").then(function(res) {
    return res.json();
  }).then(function(evts) {
    var el = document.getElementById("health-history-section");
    if (!el || !evts || evts.length === 0) return;

    var now = Date.now();
    var dayAgo = now - 24 * 60 * 60 * 1000;
    var segments = [];
    var sorted = evts.slice().sort(function(a, b) {
      return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();
    });

    var prevTime = dayAgo;
    var prevState = "unknown";
    for (var i = 0; i < sorted.length; i++) {
      var ev = sorted[i];
      var evTime = new Date(ev.created_at).getTime();
      if (evTime < dayAgo) { evTime = dayAgo; }
      if (evTime > prevTime) {
        segments.push({ state: prevState, duration: evTime - prevTime });
      }
      prevState = (ev.message && ev.message.indexOf("unhealthy") !== -1) ? "unhealthy" : "healthy";
      prevTime = evTime;
    }
    if (prevTime < now) {
      segments.push({ state: prevState, duration: now - prevTime });
    }

    var totalDuration = now - dayAgo;
    var barHtml = '';
    for (var j = 0; j < segments.length; j++) {
      var pct = (segments[j].duration / totalDuration) * 100;
      barHtml += '<div class="timeline-segment ' + segments[j].state + '" style="flex:' + pct.toFixed(2) + '" title="' + segments[j].state + '"></div>';
    }

    var ago24 = new Date(dayAgo);
    var nowDate = new Date(now);
    el.innerHTML = '<div class="health-timeline">'
      + '<h3 style="margin-top:20px;margin-bottom:8px">' + esc(t("inst.health_history")) + '</h3>'
      + '<div class="timeline-bar">' + barHtml + '</div>'
      + '<div class="timeline-labels">'
      + '<span>' + ago24.toLocaleTimeString(state.locale, { hour: "2-digit", minute: "2-digit" }) + '</span>'
      + '<span>' + nowDate.toLocaleTimeString(state.locale, { hour: "2-digit", minute: "2-digit" }) + '</span>'
      + '</div></div>';
  }).catch(function() {});
}

function bindDropZone() {
  var zone = document.getElementById("drop-zone");
  var fileInput = document.getElementById("file-input");
  if (!zone) return;

  zone.addEventListener("dragover", function(e) {
    e.preventDefault();
    zone.classList.add("drag-over");
  });
  zone.addEventListener("dragleave", function() {
    zone.classList.remove("drag-over");
  });
  zone.addEventListener("drop", function(e) {
    e.preventDefault();
    zone.classList.remove("drag-over");
    if (e.dataTransfer.files.length > 0) uploadSkillset(e.dataTransfer.files[0]);
  });
  if (fileInput) {
    fileInput.addEventListener("change", function() {
      if (this.files.length > 0) uploadSkillset(this.files[0]);
    });
  }
}

  }).then(function(sk) {
    if (onSuccess) { onSuccess(sk); }

  }).catch(function(e) {

}

    if (m.memory && m.memory.provider) {
      html += '<dt>' + esc(t("sk.memory_provider")) + '</dt><dd>' + esc(m.memory.provider) + '</dd>';
    }
    html += '</dl>';

    if (m.tools && m.tools.length > 0) {
      html += '<h3 style="font-family:var(--font-heading);font-size:14px;font-weight:500;margin-bottom:8px">' + esc(t("sk.tools")) + ' (' + m.tools.length + ')</h3>'
        + '<table class="data-table" style="margin-bottom:20px"><thead><tr><th>' + esc(t("sk.name")) + '</th><th>' + esc(t("sk.tool_type")) + '</th></tr></thead><tbody>';
      for (var i = 0; i < m.tools.length; i++) {
        html += '<tr><td>' + esc(m.tools[i].name) + '</td><td><span class="badge badge-pending">' + esc(m.tools[i].type) + '</span></td></tr>';
      }
      html += '</tbody></table>';
    }

    if (m.data_sources && m.data_sources.length > 0) {
      html += '<h3 style="font-family:var(--font-heading);font-size:14px;font-weight:500;margin-bottom:8px">' + esc(t("sk.data_sources")) + ' (' + m.data_sources.length + ')</h3>'
        + '<table class="data-table" style="margin-bottom:20px"><thead><tr><th>' + esc(t("sk.binding")) + '</th><th>' + esc(t("sk.query_mode")) + '</th></tr></thead><tbody>';
      for (var j = 0; j < m.data_sources.length; j++) {
        html += '<tr><td>' + esc(m.data_sources[j].binding) + '</td><td><span class="badge badge-pending">' + esc(m.data_sources[j].query_mode) + '</span></td></tr>';
      }
      html += '</tbody></table>';
    }

    if (m.capabilities) {
      var caps = Object.keys(m.capabilities);
      if (caps.length > 0) {
        html += '<h3 style="font-family:var(--font-heading);font-size:14px;font-weight:500;margin-bottom:8px">' + esc(t("sk.capabilities")) + '</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">';
        for (var k = 0; k < caps.length; k++) {
          var badgeClass = m.capabilities[caps[k]] ? "badge-active" : "badge-pending";
          html += '<span class="badge ' + badgeClass + '">' + esc(caps[k]) + '</span>';
        }
        html += '</div>';
      }
    }

    if (m.memory && m.memory.config) {
      var mkeys = Object.keys(m.memory.config);
      if (mkeys.length > 0) {
        html += '<h3 style="font-family:var(--font-heading);font-size:14px;font-weight:500;margin-bottom:8px">' + esc(t("sk.memory")) + '</h3>'
          + '<dl class="detail-grid" style="margin-bottom:20px">';
        for (var mc = 0; mc < mkeys.length; mc++) {
          html += '<dt>' + esc(mkeys[mc]) + '</dt><dd>' + esc(m.memory.config[mkeys[mc]]) + '</dd>';
        }
        html += '</dl>';
      }
    }

    if (m.ui && m.ui.removals && m.ui.removals.length > 0) {
      html += '<h3 style="font-family:var(--font-heading);font-size:14px;font-weight:500;margin-bottom:8px">' + esc(t("sk.removals")) + '</h3><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px">';
      for (var r = 0; r < m.ui.removals.length; r++) {
        html += '<span class="badge badge-pending">' + esc(m.ui.removals[r]) + '</span>';
      }
      html += '</div>';
    }

    html += '</div>';
    content.innerHTML = html;
  }).catch(function(e) {
    if (e.message !== "Unauthorized") showToast(t("err.skillset", { msg: e.message }));
  });
}

function showDeleteSkillsetModal(name) {
  showModal(
    '<div class="modal">'
    + '<div class="modal-title">' + esc(t("sk.del_title")) + '</div>'
    + '<div class="modal-desc">' + esc(t("sk.del_desc_pre")) + ' <strong>' + esc(name) + '</strong> ' + esc(t("sk.del_desc_post")) + '</div>'
    + '<div class="modal-actions">'
    + '<button class="btn btn-ghost" id="m-cancel">' + esc(t("cancel")) + '</button>'
    + '<button class="btn btn-danger" id="m-delete-skillset">' + esc(t("sk.delete")) + '</button>'
    + '</div></div>'
  );
  document.getElementById("m-cancel").addEventListener("click", closeModal);
  document.getElementById("m-delete-skillset").addEventListener("click", function() {
    this.disabled = true;
    apiFetch("/api/skillsets/" + encodeURIComponent(name), { method: "DELETE" }).then(function(res) {
      if (!res.ok) return res.json().then(function(err) { throw new Error(err.message || err.error || t("err.failed")); });
      closeModal();
      showToast(t("sk.deleted", { name: name }), "success");
      state.skillsetDetail = "";
      navigate("skillsets");
    }).catch(function(e) {
      document.getElementById("m-delete-skillset").disabled = false;
      if (e.message !== "Unauthorized") showToast(t("err.action", { msg: e.message }));
    });
  });
}

/* ── Query Playground ──────────────────────────────────────────────── */

function renderQuery() {
  var content = document.getElementById("content");
  document.getElementById("page-meta").textContent = "";

  content.innerHTML = '<div class="query-input-row">'
    + '<input class="input" id="q-input" placeholder="' + esc(t("q.placeholder")) + '" autofocus>'
    + '<button class="btn btn-primary" id="q-submit">' + esc(t("q.btn")) + '</button>'
    + '</div>'
    + '<div class="query-opts">'
    + '<label>' + esc(t("q.topk")) + '</label><input class="input" id="q-topk" type="number" value="5" min="1" max="50">'
    + '<label>' + esc(t("q.source")) + '</label><input class="input" id="q-source" placeholder="' + esc(t("q.all")) + '" style="width:140px">'
    + '</div>'
    + '<div id="q-results"></div>';

  document.getElementById("q-submit").addEventListener("click", doQuery);
  document.getElementById("q-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") doQuery();
  });
}

function doQuery() {
  var query = document.getElementById("q-input").value.trim();
  if (!query) return;
  var topk = parseInt(document.getElementById("q-topk").value, 10) || 5;
  var sourceId = document.getElementById("q-source").value.trim();
  var btn = document.getElementById("q-submit");
  var results = document.getElementById("q-results");
  btn.disabled = true;
  btn.textContent = t("q.searching");
  results.innerHTML = skeletonCards(2);

  var payload = { query: query, top_k: topk };
  if (sourceId) payload.source_id = sourceId;

  apiFetch("/api/query", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  }).then(function(res) {
    if (!res.ok) return res.json().then(function(err) { throw new Error(err.message || err.error || "Query failed"); });
    return res.json();
  }).then(function(data) {
    btn.disabled = false;
    btn.textContent = t("q.btn");
    var items = data.results || [];
    document.getElementById("page-meta").textContent = tPlural("meta.results", items.length);

    if (items.length === 0) {
      results.innerHTML = '<div class="empty-state">'
        + '<svg class="empty-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>'
        + '<div class="empty-title">' + esc(t("q.empty_title")) + '</div>'
        + '<div class="empty-desc">' + esc(t("q.empty_desc")) + '</div>'
        + '</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      var score = (r.score * 100).toFixed(1);
      html += '<div class="result-card">'
        + '<div class="result-header">'
        + '<div class="result-meta">';
      if (r.file) html += '<span>' + esc(t("q.file")) + ': ' + esc(r.file) + '</span>';
      if (r.source_id) html += '<span>' + esc(t("q.source_id")) + ': ' + esc(r.source_id) + '</span>';
      if (r.chunk_idx !== undefined) html += '<span>' + esc(t("q.chunk")) + ': ' + r.chunk_idx + '</span>';
      html += '</div>'
        + '<span class="result-score">' + score + '%</span>'
        + '</div>'
        + '<div class="result-text">' + esc(r.text) + '</div>'
        + '</div>';
    }
    results.innerHTML = html;
  }).catch(function(e) {
    btn.disabled = false;
    btn.textContent = t("q.btn");
    results.innerHTML = '';
    if (e.message !== "Unauthorized") showToast(t("err.action", { msg: e.message }));
  });
}

/* ── Activity Feed ────────────────────────────────────────────────── */

function renderActivity() {
  apiFetch("/api/events").then(function(res) { return res.json(); }).then(function(evts) {
    var content = document.getElementById("content");
    document.getElementById("page-meta").textContent = tPlural("meta.events", evts.length);

    if (evts.length === 0) {
      content.innerHTML = '<div class="empty-state">'
        + '<svg class="empty-icon" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>'
        + '<div class="empty-title">' + esc(t("act.empty_title")) + '</div>'
        + '<div class="empty-desc">' + esc(t("act.empty_desc")) + '</div>'
        + '</div>';
      return;
    }

    var html = '<table class="data-table"><thead><tr>'
      + '<th>' + esc(t("act.time")) + '</th><th>' + esc(t("act.type")) + '</th><th>' + esc(t("act.instance")) + '</th><th>' + esc(t("act.message")) + '</th>'
      + '</tr></thead><tbody>';
    for (var i = 0; i < evts.length; i++) {
      var ev = evts[i];
      var badge = ev.type === "error" ? "error" : (ev.type === "destroy" ? "pending" : "active");
      html += '<tr>'
        + '<td style="white-space:nowrap">' + formatDate(ev.created_at) + '</td>'
        + '<td><span class="badge badge-' + badge + '">' + esc(ev.type) + '</span></td>'
        + '<td style="font-family:var(--font-mono);font-size:12px">' + esc(ev.instance || "—") + '</td>'
        + '<td>' + esc(ev.message) + '</td>'
        + '</tr>';
    }
    html += '</tbody></table>';
    content.innerHTML = html;
  }).catch(function(e) {
    if (e.message !== "Unauthorized") showToast(t("err.events", { msg: e.message }));
  });
}

/* ── Placeholder Pages ─────────────────────────────────────────────── */

function renderPlaceholder(page) {
  document.getElementById("page-meta").textContent = "";
  var desc = page === "settings" ? t("settings.desc") : "";
  document.getElementById("content").innerHTML =
    '<div class="placeholder-page">'
    + '<h2>' + esc(t("coming_soon")) + '</h2>'
    + '<p>' + esc(desc) + '</p>'
    + '</div>';
}

/* ── Event Delegation ──────────────────────────────────────────────── */

document.getElementById("content").addEventListener("click", function(e) {
  var card = e.target.closest("[data-action='detail']");
  if (card) { showDetail(card.dataset.id); return; }
  var back = e.target.closest("[data-action='back']");
  if (back) { navigate("instances"); return; }
  var destroy = e.target.closest("[data-action='destroy']");
  if (destroy) { showDestroyModal(destroy.dataset.id); return; }
  var prov = e.target.closest("#btn-provision, #btn-provision-empty");
  if (prov) { showProvisionModal(); return; }
  var srcDetail = e.target.closest("[data-action='source-detail']");
  if (srcDetail) { showSourceDetail(srcDetail.dataset.id); return; }
  var srcBack = e.target.closest("[data-action='source-back']");
  if (srcBack) { navigate("sources"); return; }
  var skDetail = e.target.closest("[data-action='skillset-detail']");
  if (skDetail) { showSkillsetDetail(skDetail.dataset.name); return; }
  var skBack = e.target.closest("[data-action='skillset-back']");
  if (skBack) { navigate("skillsets"); return; }
  var skDownload = e.target.closest("[data-action='download-skillset']");
  if (skDownload) { downloadSkillset(skDownload.dataset.name); return; }
  var skDelete = e.target.closest("[data-action='delete-skillset']");
  if (skDelete) { showDeleteSkillsetModal(skDelete.dataset.name); return; }
});

document.getElementById("content").addEventListener("keydown", function(e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = e.target.closest("[data-action][tabindex]");
  if (!el) return;
  e.preventDefault();
  el.click();
});

document.getElementById("content").addEventListener("change", function(e) {
  if (e.target.matches("[data-action='replace-skillset']")) {
    var inp = e.target;
    if (inp.files.length === 0) return;
    var skName = inp.dataset.name;
    uploadSkillset(inp.files[0], function(sk) {
      showToast(t("sk.replaced", { name: sk.name }), "success");
      if (sk.name !== skName) { showSkillsetDetail(sk.name); }
      else { renderSkillsetDetail(skName); }
    });
    inp.value = "";
  }
});

/* ── Utilities ─────────────────────────────────────────────────────── */

function esc(s) {
  if (s == null) return "";
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatDate(s) {
  if (!s) return "—";
  try {
    var d = new Date(s);
    if (isNaN(d.getTime())) return esc(s);
    var loc = state.locale || "en";
    return d.toLocaleDateString(loc, { month: "short", day: "numeric", year: "numeric" })
      + " " + d.toLocaleTimeString(loc, { hour: "2-digit", minute: "2-digit" });
  } catch (_) { return esc(s); }
}

/* ── Init ──────────────────────────────────────────────────────────── */

loadAllLocales().then(function() { initAuth(); }).catch(function() { initAuth(); });
</script>
